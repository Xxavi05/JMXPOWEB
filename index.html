<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1 style="text-align: center;"><i>FORMULARIO DE REGISTRO</i></h1>
    <hr grosor="2" color="black">
    <h2>Evento Universitario</h2>
    <form>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required><br>
        <label for="correo">Correo Electrónico:</label>
        <input type="email" id="correo" name="correo" required><br>
        <label for="edad">Edad:</label>
        <input type="number" id="edad" min="17" max="60" name="edad" required><br>
        <label for="fechaNacimiento"> Fecha de Nacimiento:</label>
        <input type="date" id="fechaNacimiento" name="fechaNacimiento" required><br>
        <label for="Carrera">Carrera:</label>
        <select id="Carrera" name="Carrera" required>
            <option value="" selected disabled>Seleccione una carrera</option>
            <option value="Contabilidad">Contabilidad</option>
            <option value="Tecnología">Tecnología</option>
            <option value="Finanzas">Finanzas</option>
            <option value="Turismo">Turismo</option>
            <option value="Administracion"> Administración</option>
        </select><br>
        <label for="Turno">Selección de Turno:</label>
        <input type="radio" id="Matutino" name="turno" value="Matutino" required>
        <label for="Matutino">Matutino</label>
        <input type="radio" id="Vespertino" name="turno" value="Vespertino" required>
        <label for="Vespertino">Vespertino</label>
        <br>
        <input type="checkbox" id="terminos" name="terminos" required>
        <label for="terminos">Acepto los términos y condiciones</label>
        <br>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpiar">
    </form>
</body>
</html>
